# Vidoxlabs CI — reusable workflow template
#
# The public agent-family discipline, as a starting point:
#   - Node >= 22.13 (engines floor the family repos pin)
#   - `npm test` is a hard gate — never continue-on-error
#   - zero runtime dependencies, so install only when lockfiles exist
# Edit for the needs of the repo you copy this into.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13

      - name: Install dependencies (only when a lockfile exists)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No lockfile — zero-runtime-dependency repository, skipping install."
          fi

      - name: Test
        run: npm test
