# Vidoxlabs CI — reusable workflow template
#
# This template provides a standard CI pipeline for Vidoxlabs public
# repositories. Copy this file into your repo as .github/workflows/ci.yml
# and adjust the language/tooling steps as needed.
#
# Required secrets:
#   None — uses GITHUB_TOKEN (read-only)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build
        continue-on-error: true
