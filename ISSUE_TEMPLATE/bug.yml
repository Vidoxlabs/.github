---
name: Bug report
description: Report something that is broken or behaving incorrectly
labels: ["bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which Vidoxlabs project is affected?
      options:
        - videsign
        - vitools-public
        - .github (org profile)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, runtime version, or relevant tool versions.
      placeholder: "macOS 15, Node 20, Swift 6"
    validations:
      required: false
