---
name: Feature request
description: Suggest a new feature, improvement, or enhancement
labels: ["enhancement"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which Vidoxlabs project would this affect?
      options:
        - videsign
        - vitools-public
        - .github (org profile)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature or improvement are you proposing?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives have you considered?
    validations:
      required: false
